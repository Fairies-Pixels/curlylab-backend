plugins {
	id 'org.jetbrains.kotlin.jvm' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.curlylab'
version = '0.0.1-SNAPSHOT'
description = 'CurlyLab Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation'com.amazonaws:aws-java-sdk-s3:1.12.261'
    implementation'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.liquibase:liquibase-core'
	runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'io.mockk:mockk:1.13.10'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.springframework.amqp:spring-rabbit-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	implementation 'org.springframework.security:spring-security-crypto:6.4.4'
	implementation 'com.google.api-client:google-api-client:2.7.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
	implementation 'com.google.api-client:google-api-client:2.7.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.12"
}

tasks.register('jacoco-backend-test-report', JacocoReport) {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/*Application*.*',
            '**/config/*',
            '**/dto/*',
            '**/model/*',
            '**/entity/*'
    ]

    def mainSrc = "$projectDir/src/main/kotlin"
    def kotlinClasses = "$buildDir/classes/kotlin/main"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(
            fileTree(dir: kotlinClasses, excludes: fileFilter)
    )

    executionData.setFrom(fileTree(dir: "$buildDir", includes: [
            "jacoco/test.exec",
            "jacoco/testDebugUnitTest.exec",
            "outputs/unit_test_code_coverage/test.exec"
    ]))
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacoco-backend-test-report')
}